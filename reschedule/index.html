<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function () {
    var stored = localStorage.getItem('meetWithSarathTheme');
    if (stored === 'light' || stored === 'dark') {
      document.documentElement.setAttribute('data-theme', stored);
    }
  })();
</script>
<title>Reschedule — Meet with Sarath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f5; --panel:#ffffff; --surface:#f4f1ec; --border:#e2ded6;
    --text:#17191d; --muted:#5c6370; --accent:#8f6a30;
    --accent-soft:#8f6a3014; --accent-dim:#8f6a3033;
    --red:#bd3f34; --red-dim:#bd3f3433;
    --btn-text:#ffffff;
    --shadow:0 1px 2px #17191d08, 0 12px 32px #17191d0f;
    --avatar-bg:#1c4d3a; --avatar-text:#cda868;
    --serif:'Playfair Display', Georgia, serif;
    --sans:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0e14; --panel:#10161f; --surface:#161d29; --border:#232c3a;
      --text:#e6edf3; --muted:#8b98a5; --accent:#cda868;
      --accent-soft:#cda86814; --accent-dim:#cda86833;
      --red:#e0685c; --red-dim:#e0685c33;
      --btn-text:#0a0e14;
      --shadow:0 0 0 1px #ffffff0d, 0 16px 40px #00000066;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0e14; --panel:#10161f; --surface:#161d29; --border:#232c3a;
    --text:#e6edf3; --muted:#8b98a5; --accent:#cda868;
    --accent-soft:#cda86814; --accent-dim:#cda86833;
    --red:#e0685c; --red-dim:#e0685c33;
    --btn-text:#0a0e14;
    --shadow:0 0 0 1px #ffffff0d, 0 16px 40px #00000066;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:64px 20px;}

  .theme-toggle{position:fixed;top:22px;right:22px;z-index:40;width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s,color .2s,transform .15s;box-shadow:var(--shadow);}
  .theme-toggle:hover{color:var(--accent);border-color:var(--accent-dim);transform:scale(1.05);}
  .theme-toggle svg{width:17px;height:17px;}
  @media (max-width:680px){ .theme-toggle{top:14px;right:14px;} }

  .card{width:100%;max-width:520px;background:var(--panel);border-radius:20px;padding:48px 42px;box-shadow:var(--shadow);animation:fadeUp .5s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

  .host-row{display:flex;align-items:center;gap:12px;margin-bottom:26px;}
  .host-avatar{width:38px;height:38px;border-radius:50%;background:var(--avatar-bg);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;font-weight:600;color:var(--avatar-text);flex-shrink:0;}
  .host-name{font-size:13px;color:var(--text);}
  .host-role{font-size:10px;color:var(--muted);letter-spacing:.05em;}

  h1{font-size:22px;font-weight:600;color:var(--text);margin:0 0 8px;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 26px;line-height:1.7;}
  .current{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:26px;font-size:13px;color:var(--muted);}
  .current b{color:var(--text);}

  label{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}

  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-month{font-size:15px;font-weight:600;color:var(--text);}
  .nav-btn{background:none;border:1px solid var(--border);color:var(--muted);width:26px;height:26px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s;}
  .nav-btn:hover{border-color:var(--accent);color:var(--accent);}
  .nav-btn svg{width:12px;height:12px;}

  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;}
  .wd{text-align:center;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:3px 0;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:26px;}
  .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer;border:1px solid transparent;transition:all .15s;}
  .cal-cell:hover{border-color:var(--accent);color:var(--accent);}
  .cal-cell.sel{background:var(--accent);color:var(--btn-text);font-weight:600;border-color:var(--accent);}

  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:26px;}
  .slot{padding:11px;border:1px solid var(--border);border-radius:8px;text-align:center;font-size:12.5px;cursor:pointer;background:var(--surface);color:var(--muted);transition:all .15s;}
  .slot:hover{border-color:var(--accent);color:var(--text);}
  .slot.sel{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .slot.empty{grid-column:1/-1;color:var(--muted);font-size:12px;text-align:left;padding:0;background:none;border:none;cursor:default;}

  button.confirm-btn{width:100%;padding:14px;border:none;border-radius:9px;background:var(--accent);color:var(--btn-text);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:var(--sans);transition:opacity .2s;}
  button.confirm-btn:hover{opacity:.88;}
  button.confirm-btn:disabled{opacity:.35;cursor:default;}

  .success{text-align:center;padding:20px 0;}
  .success-check{width:54px;height:54px;border-radius:50%;border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
  .success-check svg{width:22px;height:22px;color:var(--accent);}
  .success h2{color:var(--text);font-size:22px;font-weight:600;margin:0 0 10px;}
  .success p{color:var(--muted);font-size:13px;line-height:1.7;}

  .err{color:var(--red);font-size:11.5px;margin-top:14px;text-align:center;padding:10px 14px;border:1px solid var(--red-dim);border-radius:8px;background:var(--red-dim);display:none;}
  .err.show{display:block;}
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Switch theme">
  <svg id="themeToggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg>
</button>

<main>
<div class="page">
  <div class="card" id="app">
    <div class="host-row">
      <div class="host-avatar">SG</div>
      <div>
        <div class="host-name">Sarath G</div>
        <div class="host-role">Cyber Security Consultant</div>
      </div>
    </div>

    <h1>Reschedule your booking</h1>
    <p class="sub">Pick a new date and time. Your original booking stays reserved until you confirm the new one.</p>
    <div class="current" id="currentBox">Loading your booking…</div>

    <div id="pickerBox" style="display:none;">
      <label>Select a new date</label>
      <div class="cal-nav">
        <button class="nav-btn" id="prevBtn" onclick="changeMonth(-1)" aria-label="Previous month">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="cal-month" id="monthLabel"></div>
        <button class="nav-btn" onclick="changeMonth(1)" aria-label="Next month">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="weekdays">
        <div class="wd">Su</div><div class="wd">Mo</div><div class="wd">Tu</div>
        <div class="wd">We</div><div class="wd">Th</div><div class="wd">Fr</div><div class="wd">Sa</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>

      <label>Pick a time</label>
      <div class="slots" id="slotGrid"><div class="slot empty">Select a date first</div></div>
      <button class="confirm-btn" id="confirmBtn" disabled>Confirm new time</button>
      <div class="err" id="errBox"></div>
    </div>

    <div class="success" id="successBox" style="display:none;">
      <div class="success-check">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2>You're rescheduled.</h2>
      <p id="successText"></p>
    </div>
  </div>
</div>
</main>

<script src="/config.js"></script>
<script>
  // ── THEME TOGGLE (identical logic on every page — shared localStorage
  // key means the choice carries across the whole site automatically) ──
  const THEME_KEY = 'meetWithSarathTheme';
  const SUN_PATH = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
  const MOON_PATH = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

  function getCurrentTheme() {
    const stored = localStorage.getItem(THEME_KEY);
    if (stored === 'light' || stored === 'dark') return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function syncThemeToggleUI(theme) {
    const btn = document.getElementById('themeToggle');
    const icon = document.getElementById('themeToggleIcon');
    if (!btn || !icon) return;
    icon.innerHTML = theme === 'dark' ? SUN_PATH : MOON_PATH;
    btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  }

  function toggleTheme() {
    const next = getCurrentTheme() === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, next);
    document.documentElement.setAttribute('data-theme', next);
    syncThemeToggleUI(next);
  }

  syncThemeToggleUI(getCurrentTheme());

  const params = new URLSearchParams(location.search);
  const eventId   = params.get('eventId');
  const email     = params.get('email');
  const name      = params.get('name');
  const eventType = params.get('eventType') || 'scoping-call';

  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  let today    = new Date();
  let curYear  = today.getFullYear();
  let curMonth = today.getMonth();
  let selectedDate = null;
  let selectedTime = null;

  document.getElementById('currentBox').innerHTML =
    `<b>${name || 'Your booking'}</b><br>Choose a new slot below to move this booking.`;

  function dateKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function renderCalendar() {
    document.getElementById('monthLabel').textContent = MONTHS[curMonth] + ' ' + curYear;
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    const first = new Date(curYear, curMonth, 1).getDay();
    const total = new Date(curYear, curMonth + 1, 0).getDate();

    for (let i = 0; i < first; i++) {
      const d = document.createElement('div');
      d.className = 'cal-cell';
      d.style.visibility = 'hidden';
      grid.appendChild(d);
    }

    for (let i = 1; i <= total; i++) {
      const dt = new Date(curYear, curMonth, i);
      const isPast = dt < new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      cell.textContent = i;
      const iso = dateKey(dt);
      if (isPast) {
        cell.style.opacity = '.3';
        cell.style.pointerEvents = 'none';
      } else {
        cell.onclick = () => selectDate(iso, cell);
      }
      if (selectedDate === iso) cell.classList.add('sel');
      grid.appendChild(cell);
    }

    document.getElementById('prevBtn').disabled =
      curYear === today.getFullYear() && curMonth === today.getMonth();
  }

  function changeMonth(dir) {
    curMonth += dir;
    if (curMonth > 11) { curMonth = 0; curYear++; }
    if (curMonth < 0)  { curMonth = 11; curYear--; }
    renderCalendar();
  }

  function selectDate(iso, cellEl) {
    document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('sel'));
    cellEl.classList.add('sel');
    selectedDate = iso;
    selectedTime = null;
    document.getElementById('confirmBtn').disabled = true;
    fetchSlots(iso);
  }

  function fetchSlots(iso) {
    const slotGrid = document.getElementById('slotGrid');
    slotGrid.innerHTML = '<div class="slot empty">Loading…</div>';
    fetch(`${CONFIG.API_URL}?date=${encodeURIComponent(iso)}&eventType=${encodeURIComponent(eventType)}`)
      .then(r => r.json())
      .then(data => {
        slotGrid.innerHTML = '';
        if (!data.slots || !data.slots.length) {
          slotGrid.innerHTML = '<div class="slot empty">No slots available this day</div>';
          return;
        }
        data.slots.forEach(t => {
          const el = document.createElement('div');
          el.className = 'slot';
          el.textContent = t;
          el.onclick = () => {
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('sel'));
            el.classList.add('sel');
            selectedTime = t;
            document.getElementById('confirmBtn').disabled = false;
          };
          slotGrid.appendChild(el);
        });
      })
      .catch(() => {
        slotGrid.innerHTML = '<div class="slot empty">Could not load availability. Please try again.</div>';
      });
  }

  document.getElementById('confirmBtn').onclick = () => {
    const btn = document.getElementById('confirmBtn');
    const err = document.getElementById('errBox');
    err.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Rescheduling…';

    fetch(CONFIG.API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'reschedule',
        eventId, email,
        newDate: selectedDate,
        newTime: selectedTime
      })
    })
      .then(r => r.json())
      .then(res => {
        if (res.error) {
          err.textContent = res.error;
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Confirm new time';
          return;
        }
        document.getElementById('pickerBox').style.display = 'none';
        document.getElementById('currentBox').style.display = 'none';
        document.getElementById('successBox').style.display = 'block';
        document.getElementById('successText').textContent =
          `Your booking is now set for ${selectedDate} at ${selectedTime} IST. A confirmation email is on its way.`;
      })
      .catch(() => {
        err.textContent = 'Something went wrong. Please try again.';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Confirm new time';
      });
  };

  if (!eventId || !email) {
    document.getElementById('currentBox').textContent = 'This reschedule link is missing information. Please use the link from your confirmation email.';
  } else {
    document.getElementById('pickerBox').style.display = 'block';
    renderCalendar();
  }
</script>
</body>
</html>
